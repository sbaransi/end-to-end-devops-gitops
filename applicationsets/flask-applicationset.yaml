apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: end-to-end-devops-project
  namespace: argocd
spec:
  generators:
    # Git directory generator: one Application for every folder
    # under end-to-end-devops-project/ (dev, qa, prd)
    - git:
        repoURL: https://github.com/sbaransi/end-to-end-devops-gitops.git
        revision: main
        directories:
          - path: end-to-end-devops-project/*

  template:
    metadata:
      # dev-flask-app, qa-flask-app, prd-flask-app
      name: '{{path.basename}}-flask-app'
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/sbaransi/end-to-end-devops-gitops.git
        targetRevision: main
        # One shared Helm chart for all environments
        path: charts/end-to-end-devops-project
        helm:
          # The environment's own values file. The path is relative to the chart folder,
          # e.g. ../../end-to-end-devops-project/dev/values.yaml
          valueFiles:
            - '../../{{path}}/values.yaml'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
