apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-flask-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: devops.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-flask-svc
            port:
              number: 5001
